# Minimal port of alacritty.toml for the graphics-protocol spike:
# inline mermaid/images in nvim via snacks.image needs the kitty protocol,
# which alacritty deliberately does not implement.

font_family      FiraCode Nerd Font
font_size        8.0

background_opacity 0.75
hide_window_decorations yes

# material-ish palette, ported from alacritty.toml
foreground #eeffff
background #181a20
cursor     #eeffff
cursor_text_color #212121

color0  #212121
color1  #f07178
color2  #c3e88d
color3  #ffcb6b
color4  #82aaff
color5  #c792ea
color6  #89ddff
color7  #eeffff
color8  #4a4a4a
color9  #f07178
color10 #c3e88d
color11 #ffcb6b
color12 #82aaff
color13 #c792ea
color14 #89ddff
color15 #ffffff
color16 #f78c6c
color17 #ff5370
color18 #303030
color19 #353535
color20 #b2ccd6
color21 #eeffff

# CSI-u parity with the alacritty bindings (shift/ctrl+enter reach tmux/reline)
map shift+enter send_text all \x1b[13;2u
map ctrl+enter  send_text all \x1b[13;5u

# font-size parity with alacritty's ctrl-0/=/- bindings
map ctrl+0     change_font_size all 0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
