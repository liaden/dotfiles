[env]
TERM = "alacritty"

[window]
opacity = 0.75
dynamic_padding = true
decorations = "None"

[window.padding]
x = 0
y = 0

[font]
size = 8

[font.normal]
family = "FiraCode Nerd Font"

[font.bold]
family = "FiraCode Nerd Font"

[font.italic]
family = "FiraCode Nerd Font"

[font.bold_italic]
family = "FiraCode Nerd Font"

[colors.primary]
background = "#181a20"
foreground = "#eeffff"

[colors.cursor]
text = "#212121"
cursor = "#eeffff"

[colors.normal]
black   = "#212121"
red     = "#f07178"
green   = "#c3e88d"
yellow  = "#ffcb6b"
blue    = "#82aaff"
magenta = "#c792ea"
cyan    = "#89ddff"
white   = "#eeffff"

[colors.bright]
black   = "#4a4a4a"
red     = "#f07178"
green   = "#c3e88d"
yellow  = "#ffcb6b"
blue    = "#82aaff"
magenta = "#c792ea"
cyan    = "#89ddff"
white   = "#ffffff"

[[colors.indexed_colors]]
index = 16
color = "#f78c6c"

[[colors.indexed_colors]]
index = 17
color = "#ff5370"

[[colors.indexed_colors]]
index = 18
color = "#303030"

[[colors.indexed_colors]]
index = 19
color = "#353535"

[[colors.indexed_colors]]
index = 20
color = "#b2ccd6"

[[colors.indexed_colors]]
index = 21
color = "#eeffff"

[[keyboard.bindings]]
key = "0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "="
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B[13;2u"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u001B[13;5u"
