# disable mouse control by default - change 'off' to 'on' to enable by default.

set-window-option -g xterm-keys on

# Enable extended keys for shift-enter and other modified keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let kitty-graphics escape sequences through to the outer terminal (inline
# images in nvim via snacks.image; no-op on terminals without the protocol)
set -g allow-passthrough on

# change prefix
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Start window and pane numbers at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
setw -g aggressive-resize on

setw -g mode-keys vi

# better copy/paste
bind Escape copy-mode
bind p paste-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle
set -s copy-command 'xclip -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel

# toggle mouse mode to allow mouse copy/paste
# set mouse on with prefix M
bind M \
  set -g mouse on \;\
  display 'Mouse: ON'
# set mouse off with prefix m
bind m \
  set -g mouse off \;\
  display 'Mouse: OFF'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Toggle the on-demand notification-feed sidebar (left pane). 'F' for Feed;
# leaves the default next-window on 'n' untouched.
bind F run-shell morning-feed-toggle

# Add a chore to the auto-dev hopper via a floating popup. 'a' for add.
bind a display-popup -E -d '#{pane_current_path}' -w 60% -h 30% -T ' hopper: add chore ' hopper-add-popup

# Pick a pending PR critique to walk through. 'R' for Review (lowercase 'r' is
# the config reload above). The popup runs the numbered picker; selecting an
# item spawns a new window running claude on that PR's critique.
bind R display-popup -E -d '#{pane_current_path}' -w 70% -h 40% -T ' review: pick a PR critique ' 'review-pr --pick'

# improve jumping in and out of vim and tmux panes
bind -n M-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys M-h) || tmux select-pane -L"
bind -n M-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys M-j) || tmux select-pane -D"
bind -n M-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys M-k) || tmux select-pane -U"
bind -n M-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys M-l) || tmux select-pane -R"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# v and - match herdr's split keys
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '\' split-window -fh -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

set -g focus-events on

set -as terminal-features 'xterm-256color:RGB'

set -g status-position top

# Catppuccin here and tokyo-night in herdr, so each multiplexer is recognisable
# at a glance. It lives outside plugins/ because tpm's clean deletes any folder
# there that is not a declared @plugin.
if "test ! -d ~/.local/share/tmux/catppuccin" \
   "run 'git clone -q -b v2.3.2 --depth 1 https://github.com/catppuccin/tmux.git ~/.local/share/tmux/catppuccin'"
set -g @catppuccin_flavor 'mocha'
run ~/.local/share/tmux/catppuccin/catppuccin.tmux
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right ''

# See https://github.com/tmux-plugins/tpm  for info

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep saved sessions out of ~/.tmux, which is the only thing tmux still wanted
# in $HOME now that the config and plugins live under ~/.config/tmux. Session
# snapshots are state, not config, so they belong in XDG_STATE_HOME.
#
# Spelled with a tilde rather than $XDG_STATE_HOME on purpose: resurrect expands
# this with a sed that only understands ~, $HOME and $HOSTNAME, so any other
# variable would survive literally and create a directory named after it.
# ~/.local/state is XDG_STATE_HOME's default anyway.
#
# continuum has no directory option of its own -- it saves through resurrect,
# so it follows this automatically.
set -g @resurrect-dir '~/.local/state/tmux/resurrect'

# exits by default on MacOS otherwise
#set-option -g default-command "reattach-to-user-namespace -l /bin/zsh"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.config/tmux/plugins/tpm/tpm'
