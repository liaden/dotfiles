"$schema" = 'https://starship.rs/config-schema.json'

# Port of ~/.zsh/p10k.zsh (p10k-rainbow, 2020 wizard + hand edits).
#
# Colours are terminal palette INDICES (0-255), not hex, exactly as p10k used
# them — the prompt follows the terminal theme instead of hardcoding one.
# Measured from the real p10k prompt: os bg=7, dir bg=4, git bg=3, fill fg=240.
#
# Only modules named below render; starship's ~60 default language modules are
# excluded by having an explicit `format` rather than $all.

add_newline = true   # = POWERLEVEL9K_PROMPT_ADD_NEWLINE (blank line between prompts)

# Right-hand content lives in `format` before $line_break, NOT in right_format:
# right_format maps to zsh RPROMPT, which renders on the prompt's LAST line.
# p10k puts it on line 1, and [fill] is what pushes it there.
format = """
[](fg:7)\
$os\
[](fg:7 bg:4)\
$directory\
${custom.dir_close}\
([](fg:4 bg:3)$git_branch$git_status[ ](bg:3)[](fg:3))\
$fill\
$status\
$jobs\
$direnv\
$nodejs$ruby$python$golang$rust\
([](fg:0)$username$hostname)\
$cmd_duration\
${custom.time_cap}\
$time\
$line_break\
$character"""

# = MULTILINE_FIRST_PROMPT_GAP_CHAR='─' / GAP_FOREGROUND=240
[fill]
symbol = "─"
style = "fg:240"

[os]
disabled = false
format = "[ $symbol ](fg:0 bg:7)"

[os.symbols]
# Every entry here must be a Nerd Font glyph, never a starship default.
# The built-in symbols are emoji, and an emoji breaks [fill]: starship measures
# the prompt with unicode-width, which scores U+FE0F (VARIATION SELECTOR-16) as
# 0 and the base codepoint as 1, while the terminal honours VS16 and draws two
# cells. [fill] then pads to one column too many, so the last character of the
# right-hand side wraps onto a line of its own.
#
# Arch is what this bit: its default is U+1F397 + U+FE0F, so a prompt starship
# measured at 100 columns rendered as 101. Macos and Ubuntu were already
# overridden below, which is why only Arch showed it. U+F303 is
# nf-linux-archlinux -- flat and single-width like the rest of the prompt.
# Without an explicit Macos entry starship falls back to its default emoji
# apple, which is not in the Nerd Font and so renders via Apple Color Emoji --
# double-width and full colour in a prompt that is otherwise flat palette
# indices. This is nf-md-apple (U+F0035), from the Material Design range.
Macos = "󰀵"
Ubuntu = ""
Arch = ""
Debian = ""
Linux = ""

[directory]
style = "fg:254 bg:4"
format = "[  $path ]($style)[$read_only]($read_only_style)"
read_only = "  "
read_only_style = "fg:254 bg:4"
truncation_length = 0          # DIR_MAX_LENGTH=80 / show the path
truncate_to_repo = false
# p10k used SHORTEN_STRATEGY=truncate_to_unique (shortest *unique* prefix).
# starship has no equivalent; this is the nearest thing — a fixed 1 char.
fish_style_pwd_dir_length = 1
truncation_symbol = ""         # = SHORTEN_DELIMITER='' (no ellipsis)

[git_branch]
symbol = " "                  # = VCS_BRANCH_ICON ' '
style = "fg:0 bg:3"
format = "[ $symbol$branch(:$remote_branch)]($style)"

# Mirrors my_git_formatter(): ⇣42⇡42 *42 ~42 +42 !42 ?42, with exact counts
# (p10k set every *_MAX_NUM=-1, i.e. no ">9" capping — ${count} matches that).
[git_status]
style = "fg:0 bg:3"
format = "[($ahead_behind$stashed$conflicted$staged$modified$untracked)]($style)"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇣${behind_count}⇡${ahead_count}"
stashed = " *${count}"
conflicted = " ~${count}"
staged = " +${count}"
modified = " !${count}"
untracked = " ?${count}"       # = VCS_UNTRACKED_ICON '?'

# Right-side segments each carry their own head cap and no tail, ending
# flush at the next segment or the terminal edge. The cap sits on the
# default bg (p10k drew it on the left neighbour's bg) because no module
# knows which neighbour is currently visible.

# p10k: STATUS_OK=false (silent on success) and STATUS_ERROR=false, but
# ERROR_SIGNAL/ERROR_PIPE=true — so only signals and pipe failures surface.
[status]
disabled = false
success_symbol = ""
symbol = ""
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
signal_symbol = "✘"
style = "fg:0 bg:7"
format = "([](fg:7)[ $symbol$signal_name ]($style))"
pipestatus_segment_format = "$status"
pipestatus_format = "([](fg:7)[ $pipestatus ]($style))"
map_symbol = true
pipestatus = true

[cmd_duration]
min_time = 3_000               # ms — p10k THRESHOLD=3 was SECONDS
show_milliseconds = false
style = "fg:0 bg:3"
format = "[](fg:3)[ $duration ]($style)[](fg:7 bg:3)"

[jobs]
style = "fg:0 bg:7"
format = "[](fg:7)[ $symbol$number ]($style)"

[direnv]
disabled = false
style = "fg:3 bg:0"
format = "[](fg:0)[ $symbol$loaded ]($style)"
symbol = " "

# p10k's asdf segment has no starship equivalent; the per-language modules read
# .tool-versions. ASDF_PROMPT_ALWAYS_SHOW=false, so these stay near-silent.
[nodejs]
symbol = " "
style = "fg:2"
format = "([ $symbol$version ]($style))"

[ruby]
symbol = " "
style = "fg:1"
format = "([ $symbol$version ]($style))"

[python]
symbol = " "
style = "fg:4"
format = "([ $symbol$version ]($style))"

[golang]
symbol = " "
style = "fg:4"
format = "([ $symbol$version ]($style))"

[rust]
symbol = " "
style = "fg:208"
format = "([ $symbol$version ]($style))"

# = CONTEXT_TEMPLATE '%n@%m'
[username]
disabled = false
show_always = false            # p10k only showed context when notable
style_user = "fg:3 bg:0"
style_root = "fg:1 bg:0"
format = "[ $user ]($style)"

[hostname]
disabled = false
ssh_only = true
style = "fg:3 bg:0"
format = "[@$hostname ]($style)"

[time]
disabled = false
time_format = "%I:%M:%S %p"    # = TIME_FORMAT '%D{%I:%M:%S %p}' (12h)
style = "fg:0 bg:7"
format = "[ $time  ]($style)"

[character]
success_symbol = "[❯](bold fg:2)"
error_symbol = "[❯](bold fg:1)"
vicmd_symbol = "[❮](bold fg:2)"

# p10k closes the dir segment onto the gap line when no git segment follows.
# starship cannot express "not in a repo" natively; the `when` test can.
[custom.dir_close]
when = '! git rev-parse --is-inside-work-tree 2>/dev/null'
command = ''
format = "[](fg:4)"

# Time's head cap belongs to cmd_duration when that renders (drawn on bg:3);
# this draws the plain-bg cap otherwise. Needs STARSHIP_DURATION exported by
# the precmd hook in ~/.zshrc; 3000 mirrors cmd_duration.min_time.
[custom.time_cap]
when = 'test "${STARSHIP_DURATION:-0}" -lt 3000'
command = ''
format = "[](fg:7)"
